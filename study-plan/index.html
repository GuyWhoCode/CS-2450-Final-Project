<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ExamTrack – Study Plan</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="../style.css" />
    </head>
    <body>
        <nav class="navbar navbar-dark navbar-examtrack px-4 py-3">
            <span class="navbar-brand fw-bold fs-4">📚 ExamTrack</span>
        </nav>

        <!-- Task 2 Step 1: Study Hours -->
        <div id="view-plan-step1">
            <div class="container py-5 form-view">
                <a
                    href="../index.html"
                    class="back-link"
                    >← Back to Home</a
                >

                <div class="form-card mt-3">
                    <div class="step-bar mb-4">
                        <div class="step-dot active">1</div>
                        <div class="step-line"></div>
                        <div class="step-dot">2</div>
                    </div>

                    <h5 class="fw-bold mb-1">How much can you study?</h5>
                    <p class="text-muted small mb-4">
                        Enter the number of hours you can realistically study
                        per week.
                    </p>

                    <label class="form-label fw-semibold" for="input-study-hours"
                        >Study hours per week</label
                    >
                    <input
                        id="input-study-hours"
                        type="number"
                        min="1"
                        class="form-control form-control-lg"
                        placeholder="e.g. 10"
                    />
                    <div
                        id="study-hours-error"
                        class="invalid-feedback d-block"
                    ></div>

                    <div class="d-flex gap-2 mt-4">
                        <button
                            class="btn btn-outline-secondary flex-fill"
                            onclick="window.location.href='../index.html'"
                        >
                            Cancel
                        </button>
                        <button
                            class="btn btn-purple flex-fill"
                            onclick="submitStep1()"
                        >
                            Next →
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Task 2 Step 2: Obligations -->
        <div id="view-plan-step2" style="display: none">
            <div class="container py-5 form-view">
                <a
                    href="#"
                    class="back-link"
                    onclick="showView('view-plan-step1'); return false;"
                    >← Back</a
                >

                <div class="form-card mt-3">
                    <div class="step-bar mb-4">
                        <div class="step-dot done">✓</div>
                        <div class="step-line active"></div>
                        <div class="step-dot active">2</div>
                    </div>

                    <h5 class="fw-bold mb-1">What else takes up your time?</h5>
                    <p class="text-muted small mb-4">
                        Enter your estimated weekly hours for work, commuting,
                        clubs, etc.
                    </p>

                    <label class="form-label fw-semibold" for="input-obligations"
                        >Obligation hours per week</label
                    >
                    <input
                        id="input-obligations"
                        type="number"
                        min="0"
                        class="form-control form-control-lg"
                        placeholder="e.g. 20"
                    />
                    <div
                        id="obligations-error"
                        class="invalid-feedback d-block"
                    ></div>

                    <div class="d-flex gap-2 mt-4">
                        <button
                            class="btn btn-outline-secondary flex-fill"
                            onclick="showView('view-plan-step1')"
                        >
                            Back
                        </button>
                        <button
                            class="btn btn-purple flex-fill"
                            onclick="submitStep2()"
                        >
                            Generate Plan
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Task 2: Loading -->
        <div id="view-plan-loading" style="display: none">
            <div class="loading-screen">
                <div
                    class="spinner-border spinner-border-lg text-purple"
                    role="status"
                    aria-label="Loading"
                ></div>
                <p class="text-muted mt-2">Generating your study plan...</p>
            </div>
        </div>

        <!-- Task 2: Output -->
        <div id="view-plan-output" style="display: none">
            <div class="container py-4" style="max-width: 560px">
                <h4 class="fw-bold mt-2">Your Study Plan</h4>
                <p id="plan-summary" class="text-muted small mb-4"></p>
                <div id="plan-schedule"></div>
                <div class="d-flex gap-2 mt-4">
                    <button
                        class="btn btn-outline-secondary flex-fill"
                        onclick="showView('view-plan-step1')"
                    >
                        Generate Again
                    </button>
                    <button
                        class="btn btn-purple flex-fill"
                        onclick="window.location.href='../index.html'"
                    >
                        Back to Home
                    </button>
                </div>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
