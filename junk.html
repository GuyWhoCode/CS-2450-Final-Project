<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Class Autocomplete</title>
  <style>
    .autocomplete {
      position: relative;
      width: 300px;
    }

    #classInput {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }

    .suggestions {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      border: 1px solid #ccc;
      border-top: none;
      background: white;
      z-index: 10;
      max-height: 160px;
      overflow-y: auto;
    }

    .suggestion-item {
      padding: 10px;
      cursor: pointer;
    }

    .suggestion-item:hover {
      background: #f0f0f0;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <label for="classInput">Search by class:</label>

  <div class="autocomplete">
    <input
      type="text"
      id="classInput"
      placeholder="Type a class name..."
      autocomplete="off"
    />
    <div id="suggestions" class="suggestions hidden"></div>
  </div>

  <script>
    const EXAMS = [
      {
        examName: "Data Structures Midterm",
        className: "CS301",
        date: "2026-05-07",
        priority: "high",
      },
      {
        examName: "Psychology Quiz",
        className: "PSY101",
        date: "2026-05-08",
        priority: "medium",
      },
      {
        examName: "Cybersecurity Midterm",
        className: "CS350",
        date: "2026-05-09",
        priority: "high",
      },
      {
        examName: "Psychology Final",
        className: "PSY101",
        date: "2026-05-20",
        priority: "low",
      },
      {
        examName: "Python Exam",
        className: "CS150",
        date: "2026-05-22",
        priority: "medium",
      },
    ];

    const input = document.getElementById("classInput");
    const suggestionsBox = document.getElementById("suggestions");

    const classNames = [...new Set(EXAMS.map(exam => exam.className))];

    input.addEventListener("input", () => {
      const searchText = input.value.toLowerCase();

      suggestionsBox.innerHTML = "";

      if (!searchText) {
        suggestionsBox.classList.add("hidden");
        return;
      }

      const matches = classNames.filter(className =>
        className.toLowerCase().includes(searchText)
      );

      if (matches.length === 0) {
        suggestionsBox.classList.add("hidden");
        return;
      }

      matches.forEach(className => {
        const item = document.createElement("div");
        item.classList.add("suggestion-item");
        item.textContent = className;

        item.addEventListener("click", () => {
          input.value = className;
          suggestionsBox.classList.add("hidden");
        });

        suggestionsBox.appendChild(item);
      });

      suggestionsBox.classList.remove("hidden");
    });

    document.addEventListener("click", event => {
      if (!event.target.closest(".autocomplete")) {
        suggestionsBox.classList.add("hidden");
      }
    });
  </script>

</body>
</html>
