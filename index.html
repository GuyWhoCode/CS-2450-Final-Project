<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ExamTrack</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <nav class="navbar navbar-dark navbar-examtrack px-4 py-3">
            <span class="navbar-brand fw-bold fs-4">📚 ExamTrack</span>
        </nav>

        <div id="view-dashboard">
            <div class="hero-banner text-white text-center py-5 px-3">
                <h1 class="fw-bold mb-2">Stay Ahead of Your Exams</h1>
                <p class="mb-4 hero-sub">
                    Visualize your upcoming exams and build a personalized study
                    plan.
                </p>
                <button
                    class="btn btn-light btn-lg px-5 fw-semibold hero-btn"
                    onclick="window.location.href='study-plan.html'"
                >
                    Generate Study Plan
                </button>
            </div>

            <div class="container py-4" style="max-width: 700px">
                <div class="form-card mb-4">
                    <h5 class="fw-bold mb-3">Add an Exam</h5>
                    <div class="row g-2">
                        <div class="col-md-6">
                            <input
                                id="class-name"
                                type="text"
                                class="form-control"
                                placeholder="Class name (e.g. CS301)"
                            />
                        </div>
                        <div class="col-md-6">
                            <input
                                id="exam-name"
                                type="text"
                                class="form-control"
                                placeholder="Exam name (e.g. Midterm)"
                            />
                        </div>
                        <div class="col-md-6">
                            <input
                                id="exam-date"
                                type="date"
                                class="form-control"
                            />
                        </div>
                        <div class="col-md-6">
                            <select id="exam-priority" class="form-select">
                                <option value="high">High priority</option>
                                <option value="medium">Medium priority</option>
                                <option value="low">Low priority</option>
                            </select>
                        </div>
                    </div>
                    <div id="class-error" class="invalid-feedback d-block mt-1"></div>
                    <button class="btn btn-purple mt-3" onclick="addClassExam()">
                        Add Exam
                    </button>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h6 class="fw-bold mb-0">
                        All Exams (<span id="exam-count">0 exams</span>)
                    </h6>
                </div>
                <div id="exam-list" class="mb-4"></div>

                <h6 class="fw-bold mb-2">Upcoming (Next 7 Days)</h6>
                <div id="urgent-list"></div>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
